services:
  - type: web
    name: velarith-api
    runtime: python
    rootDir: backend
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # Set all secrets via the Render dashboard (Environment tab), never commit values here.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: FINNHUB_API_KEY
        sync: false
      - key: AI_PRIMARY_PROVIDER
        value: claude
      - key: AI_FALLBACK_PROVIDER
        value: groq
      - key: AI_PRIMARY_MODEL
        value: claude-sonnet-4-5-20250929
      - key: AI_FALLBACK_MODEL
        value: llama-3.3-70b-versatile
      # CORS — set your Vercel frontend URL before first deploy.
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ALLOWED_ORIGIN_REGEX
        sync: false
