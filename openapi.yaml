openapi: 3.0.3
info:
  title: Stock Analyzer API
  version: 1.0.0
  description: |
    Backend API for Stock Analyzer — provides AI-powered stock analytics,
    including technical indicators, sentiment analysis, and macro market context.

servers:
  - url: http://localhost:10000
    description: Local development server

paths:
  /:
    get:
      summary: Health check
      description: Returns API status.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  message:
                    type: string
                    example: Stock Analyzer API is live.

  /technical/{ticker}:
    get:
      summary: Technical Analysis for a Stock
      description: |
        Returns computed technical indicators, chart image (base64), 
        and a quantitative signal (bullish/bearish).
      parameters:
        - name: ticker
          in: path
          required: true
          schema:
            type: string
          example: AAPL
      responses:
        '200':
          description: Technical indicators for the given ticker
          content:
            application/json:
              schema:
                type: object
                properties:
                  ticker:
                    type: string
                    example: AAPL
                  technical_summary:
                    type: object
                    description: Key metrics and indicators
                  signal_score:
                    type: number
                    example: 78
                  chart_base64:
                    type: string
                    description: Base64-encoded PNG chart image
                    example: "iVBORw0KGgoAAAANSUhEUgAA..."
        '400':
          description: Invalid ticker or data fetch failure
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: No data for AAPL
  
  /fundamental/{ticker}:
    get:
      summary: Fundamental Analysis for a Stock
      description: |
        Returns key fundamental ratios, company info, and proprietary scores
        (value, growth, health) based on yfinance data.
      parameters:
        - name: ticker
          in: path
          required: true
          schema:
            type: string
          example: AAPL
      responses:
        '200':
          description: Fundamental analysis for the given ticker
          content:
            application/json:
              schema:
                type: object
                properties:
                  summary:
                    type: object
                    description: Key fundamental metrics and company information
                    properties:
                      ticker:
                        type: string
                        example: AAPL
                      longName:
                        type: string
                        example: Apple Inc.
                      sector:
                        type: string
                        example: Technology
                      industry:
                        type: string
                        example: Consumer Electronics
                      country:
                        type: string
                        example: United States
                      website:
                        type: string
                        example: https://www.apple.com
                      longBusinessSummary:
                        type: string
                        example: "Apple Inc. designs, manufactures, and markets..."
                      marketCap:
                        type: number
                        example: 2700000000000
                      trailingPE:
                        type: number
                        format: float
                        example: 28.5
                      forwardPE:
                        type: number
                        format: float
                        example: 26.8
                      priceToBook:
                        type: number
                        format: float
                        example: 42.1
                      revenueGrowth:
                        type: number
                        format: float
                        example: 0.081
                      earningsGrowth:
                        type: number
                        format: float
                        example: 0.12
                      profitMargins:
                        type: number
                        format: float
                        example: 0.257
                      returnOnEquity:
                        type: number
                        format: float
                        example: 1.62
                      returnOnAssets:
                        type: number
                        format: float
                        example: 0.28
                      debtToEquity:
                        type: number
                        format: float
                        example: 148.8
                      currentRatio:
                        type: number
                        format: float
                        example: 0.98
                      quickRatio:
                        type: number
                        format: float
                        example: 0.75
                      dividendYield:
                        type: number
                        format: float
                        example: 0.0055
                      payoutRatio:
                        type: number
                        format: float
                        example: 0.147
                      sharesOutstanding:
                        type: number
                        example: 15500000000
                      beta:
                        type: number
                        format: float
                        example: 1.28
                      '52WeekChange':
                        type: number
                        format: float
                        example: 0.152
                  scores:
                    type: object
                    description: Proprietary scores from 0.0 to 1.0
                    properties:
                      value_score:
                        type: number
                        format: float
                        example: 0.6525
                        nullable: true
                      growth_score:
                        type: number
                        format: float
                        example: 0.8100
                        nullable: true
                      health_score:
                        type: number
                        format: float
                        example: 0.9200
                        nullable: true
                      final_score:
                        type: number
                        format: float
                        example: 0.7830
                        nullable: true
        '400':
          description: Invalid ticker or data fetch failure
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: No fundamental data found for AAPL

  /sentiment/{ticker}:
    get:
      summary: Aggregated Sentiment Analysis
      description: |
        Combines multiple sentiment sources — news, Google Trends, and Polymarket prediction markets.
        Returns normalized scores (0–100) and an overall composite sentiment.
      parameters:
        - name: ticker
          in: path
          required: true
          schema:
            type: string
          example: MSFT
      responses:
        '200':
          description: Aggregated sentiment for the given ticker
          content:
            application/json:
              schema:
                type: object
                properties:
                  ticker:
                    type: string
                    example: MSFT
                  sources:
                    type: object
                    properties:
                      news:
                        type: object
                        properties:
                          score:
                            type: number
                            example: 72
                          source:
                            type: string
                            example: news
                      google_trends:
                        type: object
                        properties:
                          score:
                            type: number
                            example: 61
                          source:
                            type: string
                            example: google_trends
                      polymarket:
                        type: object
                        properties:
                          score:
                            type: number
                            example: 68
                          weighted_probability:
                            type: number
                            example: 0.66
                          avg_liquidity:
                            type: number
                            example: 35000.5
                          volatility_score:
                            type: number
                            example: 14
                          source:
                            type: string
                            example: polymarket
                  composite:
                    type: number
                    description: Combined weighted sentiment score (0–100)
                    example: 67

  /macro:
    get:
      summary: Macro Market Sentiment
      description: |
        Returns market sentiment for key macroeconomic topics such as interest rates, inflation,
        and government shutdown probabilities (via Polymarket).
      responses:
        '200':
          description: Macro sentiment overview
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    keyword:
                      type: string
                      example: interest rates
                    score:
                      type: number
                      example: 74
                    total_volume:
                      type: number
                      example: 89230.4
                    market_count:
                      type: integer
                      example: 3
