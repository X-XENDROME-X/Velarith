openapi: 3.0.3
info:
  title: Stock Analyzer API
  version: 1.0.0
  description: |
    Backend API for Stock Analyzer — provides AI-powered stock analytics,
    including technical, fundamental, sentiment, and composite scores.

servers:
  - url: http://localhost:10000
    description: Local development server

paths:
  /:
    get:
      summary: Health check
      description: Returns API status and available endpoints.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  message:
                    type: string
                    example: Stock Analyzer API is live.
                  endpoints:
                    type: object

  /technical/{ticker}:
    get:
      summary: Get Raw Technical Indicators
      description: |
        Returns computed technical indicators, chart image (base64), 
        and a quantitative signal (bullish/bearish).
      parameters:
        - name: ticker
          in: path
          required: true
          schema:
            type: string
          example: AAPL
      responses:
        '200':
          description: Technical indicators for the given ticker
          content:
            application/json:
              schema:
                # This response matches your 'technicals.py' blueprint
                type: object 
        '400':
          description: Invalid ticker or data fetch failure

  /fundamental/{ticker}:
    get:
      summary: Get Raw Fundamental Data
      description: |
        Returns a comprehensive set of fundamental and context-aware
        data for a stock. This is a data-only endpoint.
      parameters:
        - name: ticker
          in: path
          required: true
          schema:
            type: string
          example: AAPL
      responses:
        '200':
          description: Comprehensive fundamental data for the given ticker
          content:
            application/json:
              schema:
                # This is the new, flat structure from 'fundamental_core.py'
                type: object
                properties:
                  ticker:
                    type: string
                    example: AAPL
                  longName:
                    type: string
                    example: Apple Inc.
                  sector:
                    type: string
                    example: Technology
                  currentPrice:
                    type: number
                    format: float
                    example: 150.25
                  marketCap:
                    type: number
                    example: 2700000000000
                  trailingPE:
                    type: number
                    format: float
                    example: 28.5
                  forwardPE:
                    type: number
                    format: float
                    example: 26.8
                  priceToBook:
                    type: number
                    format: float
                    example: 42.1
                  returnOnEquity:
                    type: number
                    format: float
                    example: 1.62
                  revenueGrowth:
                    type: number
                    format: float
                    example: 0.081
                  earningsGrowth:
                    type: number
                    format: float
                    example: 0.12
                  debtToEquity:
                    type: number
                    format: float
                    example: 148.8
                  low52Week:
                    type: number
                    format: float
                    example: 129.04
                  high52Week:
                    type: number
                    format: float
                    example: 198.23
        '400':
          description: Invalid ticker or data fetch failure

  /sentiment/{ticker}:
    get:
      summary: Get Aggregated Sentiment
      description: |
        Combines News, Google Trends, and Polymarket sources.
        Returns a composite sentiment score and the raw source data.
      parameters:
        - name: ticker
          in: path
          required: true
          schema:
            type: string
          example: MSFT
      responses:
        '200':
          description: Aggregated sentiment for the given ticker
          content:
            application/json:
              schema:
                # This matches your 'sentiments.py' blueprint
                type: object
                properties:
                  composite:
                    type: number
                    example: 67
                  sources:
                    type: object
        '500':
          description: Sentiment analysis pipeline failed

  /macro:
    get:
      summary: Get Macro Market Sentiment
      description: |
        Returns Polymarket sentiment for key macro topics.
      responses:
        '200':
          description: Macro sentiment overview
          content:
            application/json:
              schema:
                # This matches your 'macro_blueprint.py'
                type: array
                items:
                  type: object

  /analysis/{ticker}:
    get:
      summary: Get Composite Analysis Score
      description: |
        The main endpoint. Orchestrates all modules (tech, fundamental,
        sentiment, peer) to generate a final weighted score.
      parameters:
        - name: ticker
          in: path
          required: true
          schema:
            type: string
          example: AAPL
        - name: mode
          in: query
          required: false
          description: "Analysis mode: 'short' or 'long'. Defaults to 'short'."
          schema:
            type: string
            enum: [short, long]
            default: short
      responses:
        '200':
          description: Successful analysis
          content:
            application/json:
              schema:
                # This matches your 'analysis.py' blueprint
                type: object
                properties:
                  mode:
                    type: string
                    example: long
                  ticker:
                    type: string
                    example: AAPL
                  score:
                    type: number
                    format: float
                    example: 78.5
                  breakdown:
                    type: object
                    description: The individual scores that make up the final score
                    properties:
                      fundamentals:
                        type: number
                        example: 85.0
                      peer:
                        type: number
                        example: 72.0
                      sentiment:
                        type: number
                        example: 65.0
                      insider:
                        type: number
                        example: 50.0
                  timestamp:
                    type: string
                    format: date-time
        '400':
          description: Invalid ticker or data fetch failure