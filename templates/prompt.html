<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Analysis</title>
    <style>
        body { font-family: sans-serif; background-color: #121212; color: #eee; display: grid; place-items: center; min-height: 90vh; }
        form { background: #222; border: 1px solid #444; border-radius: 8px; padding: 2rem; }
        div { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.5rem; color: #aaa; }
        input, select { width: 300px; padding: 0.5rem; background: #333; color: #eee; border: 1px solid #555; border-radius: 4px; }
        button { width: 100%; padding: 0.75rem; background: #0a84ff; color: white; border: none; border-radius: 4px; font-size: 1rem; cursor: pointer; }
    </style>
</head>
<body>
    <form action="/prompt" method="POST">
        <h2>Run New AI Analysis</h2>
        <div>
            <label for="ticker">Ticker Symbol</label>
            <input type="text" id="ticker" name="ticker" placeholder="e.g., AAPL" required>
        </div>
        <div>
            <label for="term">Investment Term</label>
            <select id="term" name="term">
                <option value="short">Short-Term (Momentum)</option>
                <option value="long" selected>Long-Term (Value)</option>
            </select>
        </div>
        <div>
            <label for="age">Your Age</label>
            <select id="age" name="age">
                <option value="18-29">18-29</option>
                <option value="30-40" selected>30-40</option>
                <option value="41-55">41-55</option>
                <option value="56+">56+</option>
            </select>
        </div>
        <div>
            <label for="risk">Risk Profile</label>
            <select id="risk" name="risk">
                <option value="conservative">Conservative</option>
                <option value="moderate" selected>Moderate</option>
                <option value="aggressive">Aggressive</option>
            </select>
        </div>
        <button type="submit">Analyze</button>
    </form>
</body>
</html>
